name: DocKeeper
options:
  bundleIdPrefix: com.automationstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DocKeeper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DocKeeper
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.automationstudio.dockeeper
        PRODUCT_NAME: DocKeeper
        INFOPLIST_FILE: DocKeeper/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ALWAYS_SEARCH_USER_PATHS: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: DocKeeper/DocKeeper.entitlements
schemes:
  DocKeeper:
    build:
      targets:
        DocKeeper: all
    run:
      config: Debug
    archive:
      config: Release
