name: BarbellLedger
options:
  bundleIdPrefix: com.automationstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BarbellLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BarbellLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.automationstudio.barbellledger
        PRODUCT_NAME: BarbellLedger
        INFOPLIST_FILE: BarbellLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: []
schemes:
  BarbellLedger:
    build:
      targets:
        BarbellLedger: all
    run:
      config: Debug
    archive:
      config: Release
