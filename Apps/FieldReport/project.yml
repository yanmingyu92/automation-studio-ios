name: FieldReport
options:
  bundleIdPrefix: com.automationstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  FieldReport:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources
    settings:
      base:
        ALWAYS_SEARCH_USER_PATHS: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.automationstudio.fieldreport
        PRODUCT_NAME: FieldReport
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
schemes:
  FieldReport:
    build:
      targets:
        FieldReport: all
    run:
      config: Debug
    archive:
      config: Release
